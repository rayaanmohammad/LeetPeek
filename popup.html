<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeetPeek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <img class="brand-mark" src="icons/icon_128.png" alt="">
      <div class="brand-copy">
        <span class="eyebrow">THE LEETCODE SCORECARD</span>
        <h1>LeetPeek<span class="period">.</span></h1>
      </div>
      <span class="edition">EST. 2025<br>NO. 01</span>
    </header>

    <main id="main-page">
      <div class="section-heading">
        <div>
          <span class="eyebrow">01 / YOUR ROSTER</span>
          <h2>The board</h2>
        </div>
        <span id="user-count" class="count-stamp">00 USERS</span>
      </div>

      <div id="data-container" class="data-container" aria-live="polite" aria-busy="true"></div>

      <div class="toolbar">
        <button id="refresh-btn" class="button button-primary" type="button">↻&nbsp; Refresh</button>
        <button id="settings-btn" class="button button-quiet" type="button">Manage users&nbsp; →</button>
      </div>
    </main>

    <main id="settings-page" hidden>
      <div class="section-heading">
        <div>
          <span class="eyebrow">02 / THE ROSTER</span>
          <h2>Manage users</h2>
        </div>
        <button id="back-btn" class="button button-quiet back-button" type="button">←&nbsp; Back</button>
      </div>

      <form id="add-form" class="add-form">
        <label for="username-input" class="field-label">LEETCODE USERNAME</label>
        <div class="input-row">
          <input type="text" id="username-input" name="username" placeholder="e.g. algorithmist" autocomplete="off" spellcheck="false" required>
          <button id="add-btn" class="button button-primary" type="submit">Add&nbsp; +</button>
        </div>
        <p id="form-message" class="form-message" role="status"></p>
      </form>

      <div class="roster-heading">
        <span class="eyebrow">SAVED LOCALLY</span>
        <span id="roster-count" class="eyebrow">00 ENTRIES</span>
      </div>
      <ul id="username-list" class="username-list"></ul>
    </main>

    <footer class="footer">
      <span>LOCAL ROSTER / LIVE STATS</span>
      <span class="footer-star" aria-hidden="true">✳</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
